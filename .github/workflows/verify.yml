# Проверяет запуск из чистой копии на отдельной виртуальной машине.
name: Проверка курсовой
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coursework:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Запуск PostgreSQL, сайта и 14 тестов API
        shell: bash
        run: |
          set -euo pipefail
          node scripts/startLocal.js > "$RUNNER_TEMP/taskboard.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/ 2>/dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat "$RUNNER_TEMP/taskboard.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ | grep -q 'Доска задач'
          npm test
